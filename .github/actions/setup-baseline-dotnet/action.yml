name: Set up the baseline .NET SDK
description: Install the exact SDK version declared in the repository's global.json

runs:
  using: composite
  steps:
    - name: Read the baseline SDK version
      id: sdk
      shell: pwsh
      run: |
        $config = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Raw | ConvertFrom-Json
        $version = $config.sdk.version
        if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'global.json must declare sdk.version.'
        }
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"

    # setup-dotnet maps latestMajor in global.json to LTS, which can be older than sdk.version.
    - name: Install the exact baseline SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ steps.sdk.outputs.version }}
