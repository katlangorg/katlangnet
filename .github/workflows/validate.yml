name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-validation:
    name: .NET validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run .NET validation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-all.ps1 -Phase DotNet

      # Runs after a failed or timed-out validation too; the job result stays the validation result.
      - name: Upload .NET validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-validation-diagnostics
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14

  lean-validation:
    name: Lean validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned Lean toolchain
        shell: bash
        run: |
          mkdir -p artifacts/validation
          bash scripts/install-lean-toolchain.sh 2>&1 | tee artifacts/validation/lean-toolchain-install.log

      - name: Run Lean validation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-all.ps1 -Phase Lean

      - name: Upload Lean validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-validation-diagnostics
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14
