name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-validation:
    name: .NET validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run .NET validation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-all.ps1 -Phase DotNet

      # Runs after a failed or timed-out validation too; the job result stays the validation result.
      - name: Upload .NET validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-validation-diagnostics
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14

  lean-validation:
    name: Lean validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned Lean toolchain
        shell: bash
        run: |
          mkdir -p artifacts/validation
          bash scripts/install-lean-toolchain.sh 2>&1 | tee artifacts/validation/lean-toolchain-install.log

      - name: Run Lean validation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-all.ps1 -Phase Lean

      - name: Upload Lean validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-validation-diagnostics
          path: artifacts/validation/
          if-no-files-found: warn
          retention-days: 14

  # The Debug jobs above cannot see a Release-only frame-size regression; this job runs the
  # focused stack suites compiled in Release. One matrix leg per architecture: ARM64 is not
  # yet measured, so x64 is the only leg for now.
  release-stack-suites:
    name: Release stack suites (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run Release stack suites
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/validate-stack-suites.ps1

      - name: Upload Release stack-suite diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-suite-diagnostics-${{ matrix.arch }}
          path: artifacts/validation/stack-suites-release-*/
          if-no-files-found: warn
          retention-days: 14

  # The solution deliberately omits the standalone tool projects (the SharpFuzz harness), so the
  # .NET validation job never compiles them. This build-only job does; it runs no tool or test.
  standalone-tool-build:
    name: Standalone tool build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build standalone tool projects
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build-standalone-tools.ps1

      - name: Upload standalone tool build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-tool-build-diagnostics
          path: artifacts/validation/standalone-tools-build-*/
          if-no-files-found: warn
          retention-days: 14
