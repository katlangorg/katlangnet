name: semantic nightly

# Exhaustive sweeps of the finite semantic-campaign recipes (seed-nested, seed-nested-wide,
# seed-nested-wider; fuzz/README.md § Campaigns). Scheduled and manual only: never on pull requests
# or pushes, and separate from validate.yml, whose standalone-tool job stays build-only. The sweeps
# took 913 s on a developer machine (83 + 620 + 210 s, 2026-11-17) plus the build. The completed
# hosted runs took 1,106 s (run 44284579331, 2026-11-18) and 1,190 s (run 44506161617, 2026-11-19)
# for the whole job, so the job allows 70 minutes: a run 50% slower than the slower one plus one sweep
# that spends its whole budget (1.5 x 1,190 + 2,400 = 4,185 s < 4,200 s), about 3.5 times that job.
# Each sweep keeps 40 minutes (--max-seconds 2400): the hosted per-recipe times are in the runs' step
# summaries and logs, which need a signed-in reader, so that budget has not been re-sized.
# Failures are persisted and reduced, and their reproducers are uploaded when the job fails.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  semantic-sweeps:
    name: Exhaustive semantic sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install baseline .NET SDK from global.json
        uses: ./.github/actions/setup-baseline-dotnet

      - name: Run the exhaustive semantic sweeps
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/run-semantic-sweeps.ps1

      # A failed, incomplete or timed-out sweep keeps its logs, summaries and every persisted
      # reproducer (failures/, reduced/ and the failing batches under work/).
      - name: Upload semantic sweep reproducers
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-sweep-reproducers
          path: artifacts/validation/semantic-sweeps-*/
          if-no-files-found: warn
          retention-days: 30
