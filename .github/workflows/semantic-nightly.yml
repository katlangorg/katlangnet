name: semantic nightly

# Exhaustive sweeps of the finite semantic-campaign recipes (seed-nested, seed-nested-wide,
# seed-nested-wider; fuzz/README.md § Campaigns). Scheduled and manual only: never on pull requests
# or pushes, and separate from validate.yml, whose standalone-tool job stays build-only.
# In runs through 44716956509 (2026-11-20), the longest recipe took 1,092 s and the longest
# whole job took 1,681 s. Allow 50% over that job plus one full 2,400-s recipe budget.
# In 90 minutes that leaves 478.5 s for finishing a batch, reporting and uploading reproducers.
# See fuzz/README.md § Nightly sweeps for the three hosted timing rows.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  semantic-sweeps:
    name: Exhaustive semantic sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install baseline .NET SDK from global.json
        uses: ./.github/actions/setup-baseline-dotnet

      - name: Run the exhaustive semantic sweeps
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/run-semantic-sweeps.ps1

      # After a failed or incomplete sweep, upload the available logs, summaries and reproducers.
      # A hard job timeout can interrupt the script or the upload itself.
      - name: Upload semantic sweep reproducers
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semantic-sweep-reproducers
          path: artifacts/validation/semantic-sweeps-*/
          if-no-files-found: warn
          retention-days: 30
